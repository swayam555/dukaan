worker_processes auto;
events { worker_connections 2048; }

http {
  log_format sync '$remote_addr $http_x_device_id "$request" $status $body_bytes_sent rt=$request_time urt=$upstream_response_time';
  access_log /dev/stdout sync;
  server_tokens off;

  # Per-device limits (device id header is also inside the JWT; this is a cheap first line of defence).
  map $http_x_device_id $device_key { default $http_x_device_id; "" $binary_remote_addr; }
  limit_req_zone $device_key zone=sync_per_device:10m rate=10r/s;
  limit_req_zone $binary_remote_addr zone=auth_per_ip:10m rate=10r/m;

  gzip on;
  gzip_types application/json application/x-ndjson;
  gzip_min_length 512;
  gzip_comp_level 5;

  upstream sync_api {
    server sync-api:4781;
    keepalive 64;
  }

  server {
    listen 80;
    listen 443 ssl;
    ssl_certificate     /etc/nginx/certs/dev.crt;
    ssl_certificate_key /etc/nginx/certs/dev.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 2m;   # one push batch (≤500 ops, gzip) is far below this
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /v1/auth/ {
      limit_req zone=auth_per_ip burst=5 nodelay;
      limit_req_status 429;
      proxy_pass http://sync_api;
    }

    location /v1/ {
      limit_req zone=sync_per_device burst=40 nodelay;
      limit_req_status 429;
      gunzip on;
      proxy_request_buffering on;
      proxy_read_timeout 30s;
      proxy_pass http://sync_api;
    }

    location = /healthz {
      proxy_pass http://sync_api/actuator/health/readiness;
    }

    # Owner web dashboard (static, read-only). Its API calls go through /v1/ like the phones'.
    location = /dashboard { return 301 /dashboard/; }
    location /dashboard/ {
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy no-referrer always;
      proxy_pass http://sync_api;
    }

    location / { return 404; }
  }
}
