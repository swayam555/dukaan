name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  js:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21, cache: maven }
      - run: cd services/sync && ./mvnw -B verify   # Testcontainers: Postgres, Redis, Kafka

  android:
    runs-on: ubuntu-latest
    needs: js
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: pnpm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - run: pnpm install --frozen-lockfile
      - run: cd apps/mobile && npx expo prebuild --platform android --no-install
      - run: cd apps/mobile/android && ./gradlew bundleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - uses: actions/upload-artifact@v4
        with: { name: app-release.aab, path: apps/mobile/android/app/build/outputs/bundle/release/*.aab }
