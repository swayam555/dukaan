# Fresh install → create a shop → seed a small demo catalogue.
appId: in.dukaan.pos
name: Setup a new shop
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: { id: setup-name }
    timeout: 60000
- tapOn: { id: setup-name }
- inputText: Sharma Kirana
- tapOn: { id: setup-pin }
- inputText: "2468"
- tapOn: { id: setup-pin2 }
- inputText: "2468"
- hideKeyboard
- tapOn: { id: setup-submit }
- extendedWaitUntil:
    visible: { id: billing-search }
    timeout: 30000
- assertVisible: { id: device-prefix }
# A small catalogue so the bill flow has items to sell.
- tapOn: More
- scrollUntilVisible:
    element: { id: more-diagnostics }
- tapOn: { id: more-diagnostics }
- scrollUntilVisible:
    element: { id: diag-seed-small }
- tapOn: { id: diag-seed-small }
- extendedWaitUntil:
    visible: { id: diag-seeded }
    timeout: 60000
- assertVisible: "Seeded 500 items.*"
- back
