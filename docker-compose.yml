# Dukaan backend. `docker compose up -d` (core) · `docker compose --profile obs up -d` (adds Prometheus + Grafana).
name: dukaan

x-jvm: &jvm
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70 -XX:+UseSerialGC -Xss512k"

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: dukaan
      POSTGRES_USER: dukaan
      POSTGRES_PASSWORD: dukaan
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=120", "-c", "wal_compression=on"]
    ports: ["127.0.0.1:4732:5432"]
    volumes: [pg:/var/lib/postgresql/data]
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dukaan -d dukaan"]
      interval: 5s
      retries: 20

  redis:
    image: redis:8.8.4-alpine
    command: ["redis-server", "--maxmemory", "96mb", "--maxmemory-policy", "volatile-lru", "--save", ""]
    ports: ["127.0.0.1:4779:6379"]
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  kafka:
    image: apache/kafka:4.4.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:4792
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 12
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: "-Xmx384m -Xms384m"
    ports: ["127.0.0.1:4792:9094"]
    mem_limit: 768m
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      retries: 30

  kafka-init:
    image: apache/kafka:4.4.0
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic shop.ops --partitions 12 --replication-factor 1 --config compression.type=lz4 --config retention.ms=1209600000
    restart: "no"

  # S3-compatible object store for device bootstrap snapshots (MinIO images are no longer published; RustFS speaks the same API).
  s3:
    image: rustfs/rustfs:1.0.6
    environment:
      RUSTFS_ACCESS_KEY: dukaan
      RUSTFS_SECRET_KEY: dukaan-secret
      RUSTFS_CONSOLE_ENABLE: "true"
    command: ["/data"]
    ports: ["127.0.0.1:4790:9000", "127.0.0.1:4791:9001"]
    volumes: [s3:/data]
    mem_limit: 256m

  sync-api:
    build: ./services/sync
    environment:
      <<: *jvm
      SPRING_PROFILES_ACTIVE: api
      DB_URL: jdbc:postgresql://postgres:5432/dukaan
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP: kafka:9092
      S3_ENDPOINT: http://s3:9000
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me-0123456789abcdef}
      DEV_OTP: ${DEV_OTP:-true}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }
    ports: ["127.0.0.1:4781:4781"]
    mem_limit: 640m
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4781/actuator/health/readiness | grep -q UP"]
      interval: 10s
      retries: 30

  nginx:
    image: nginx:1.30.6-alpine
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      sync-api: { condition: service_healthy }
    ports: ["0.0.0.0:4780:80", "0.0.0.0:4743:443"]
    mem_limit: 64m

  prometheus:
    profiles: [obs]
    image: prom/prometheus:v3.7.3
    volumes: [./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
    ports: ["127.0.0.1:4709:9090"]
    mem_limit: 256m

  grafana:
    profiles: [obs]
    image: grafana/grafana:12.2.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes: [./infra/grafana:/etc/grafana/provisioning:ro]
    ports: ["127.0.0.1:4730:3000"]
    mem_limit: 192m

volumes:
  pg:
  s3:
